name: A call did not pause the break
description: Sixty locked the screen during a call, or a break waits although no call is running.
labels: [call-detection]
body:
  - type: input
    id: app
    attributes:
      label: Call app
      description: For example "Google Meet in Arc", "Webex", "Discord".
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Output of `--probe` during the call
      description: Run `/Applications/Sixty.app/Contents/MacOS/Sixty --probe` in Terminal while the call is running and paste the output. It lists bundle IDs of apps that use audio devices, nothing else.
      render: text
    validations:
      required: true
  - type: dropdown
    id: devices
    attributes:
      label: Microphone and camera in that call
      options:
        - microphone on
        - microphone muted
        - microphone and camera off (listening only)
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5"
